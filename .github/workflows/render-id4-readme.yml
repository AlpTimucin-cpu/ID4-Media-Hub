name: Render ID.4 README Screenshots
on:
  workflow_dispatch:
  push:
    branches: [feature/mola-native-id4]
    paths:
      - 'mola-native/overlay/fermata/src/main/assets/id4/navigator.html'
      - 'docs/scripts/render_id4_readme.py'
      - '.github/workflows/render-id4-readme.yml'
permissions:
  contents: write
concurrency:
  group: id4-readme-screenshots
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mola-native-id4
          persist-credentials: true
      - name: Capture browser rendering from ID.4 HTML source
        run: python3 docs/scripts/render_id4_readme.py
      - name: Commit generated PNG previews
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: render ID.4 cockpit browser screenshots from source"
            git pull --rebase origin feature/mola-native-id4
            git push origin HEAD:feature/mola-native-id4
          fi
