name: Android 15 Startup Crash Reproduction
on:
  workflow_dispatch:
  pull_request:
    branches: [feature/fermata-style-car-video]
  push:
    branches: [feature/media-engine-migration]
    paths:
      - "app/**"
      - ".github/workflows/emulator-startup.yml"
permissions:
  contents: read
concurrency:
  group: evcockpit-android15-startup
  cancel-in-progress: true
jobs:
  android15-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore expected bundled playlists
        run: bash .github/scripts/prepare-bundled-m3u.sh
      - name: Real Android 15 emulator cold-start check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            gradle --no-daemon :app:assembleDebug -PevcockpitEmulatorTest=true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.evcockpit.mediahub.test
            adb shell am start -W -n com.evcockpit.mediahub.test/.SafeStartActivity
            sleep 6
            adb logcat -d -v threadtime > /tmp/evcockpit-startup-logcat.txt
            echo "==== AndroidRuntime fatal traces ===="
            grep -n -A 28 -B 3 "FATAL EXCEPTION\\|Process: com.evcockpit.mediahub.test\\|Fatal signal" /tmp/evcockpit-startup-logcat.txt | tail -n 130 || true
            if grep -Eq "FATAL EXCEPTION|Fatal signal" /tmp/evcockpit-startup-logcat.txt; then
              echo "::error::Android 15 emulator recorded a fatal error"
              exit 1
            fi
            adb shell pidof com.evcockpit.mediahub.test | grep -q '[0-9]' || {
              echo "::error::Main process not running after cold start"; exit 1;
            }
            echo "PASS: App remained running after cold start"
            # Click phone UI's EvGarageActivity and TurkeyNavigationActivity
            adb logcat -c
            adb shell am start -W -n com.evcockpit.mediahub.test/.EvGarageActivity
            sleep 3
            adb shell pidof com.evcockpit.mediahub.test | grep -q '[0-9]'
            adb shell am start -W -n com.evcockpit.mediahub.test/.TurkeyNavigationActivity
            sleep 6
            adb logcat -d -v threadtime > /tmp/evcockpit-navigation-logcat.txt
            grep -n -A 28 -B 3 "FATAL EXCEPTION\\|Process: com.evcockpit.mediahub.test\\|Fatal signal" /tmp/evcockpit-navigation-logcat.txt | tail -n 130 || true
            if grep -Eq "FATAL EXCEPTION|Fatal signal" /tmp/evcockpit-navigation-logcat.txt; then
              echo "::error::EV or navigation activity crashed"
              exit 1
            fi
            adb shell pidof com.evcockpit.mediahub.test | grep -q '[0-9]'
            echo "PASS: Main, EV and Navigation activities started without fatal errors"
      - name: Preserve AndroidRuntime diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android15-startup-logs
          path: |
            /tmp/evcockpit-startup-logcat.txt
            /tmp/evcockpit-navigation-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
