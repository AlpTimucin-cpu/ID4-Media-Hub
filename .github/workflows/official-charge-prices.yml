name: Verify Official Charge Prices
on:
  schedule:
    # 06:15 Türkiye time (UTC+03:00), runs when workflow is on the DEFAULT branch
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches: [feature/mola-32-migration]
    paths:
      - "scripts/update_official_charge_prices.py"
      - "scripts/tests/test_official_charge_prices.py"
      - ".github/workflows/official-charge-prices.yml"
permissions:
  contents: write
concurrency:
  group: charge-official-tariffs
  cancel-in-progress: false
jobs:
  check-operator-tariffs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test official tariff parsers
        run: python -m unittest discover -s scripts/tests -p 'test_official_charge_prices.py'
      - name: Validate official prices
        id: monitor
        continue-on-error: true
        run: python scripts/update_official_charge_prices.py
      - name: Commit verified records and unchanged-stale provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/charging/operator_prices.json
          if ! git diff --cached --quiet; then
            git commit -m "data: official AC/DC tariff verification"
            git push
          fi
      - name: Alert on source/parsing failures
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "::error::Official price retrieval/parsing incomplete. Unverified or stale prices must not be shown as current."
          exit 1
