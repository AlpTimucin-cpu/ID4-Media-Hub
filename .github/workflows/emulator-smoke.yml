name: Android emulator launch smoke test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main, feature/fermata-style-car-video]
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - 'app/**'
permissions:
  contents: read
jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build application
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM and reclaim runner disk space
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          # Android 15 emulator requires ~7.4 GB free for userdata creation.
          # The hosted image contains tools unrelated to this Android build.
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h "$HOME"
      - name: Boot emulator and open app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Pixel 6 profile otherwise asks for ~7.4GB userdata while the
          # hosted runner may have only ~7.1GB free (FATAL during AVD boot).
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -partition-size 2048
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n tr.id4.mediahub/.MainActivity
            sleep 10
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|tr.id4.mediahub' | head -20 || true
            adb shell screencap -p /sdcard/id4_home.png
            adb pull /sdcard/id4_home.png id4_home.png
            # New ID4 Drive Hub must actually render, not merely compile.
            for i in 1 2 3; do adb shell uiautomator dump /sdcard/id4_drive_home.xml >/dev/null 2>&1 && adb pull /sdcard/id4_drive_home.xml id4_drive_home.xml >/dev/null 2>&1 && break; sleep 2; done
            grep -q 'YOL ARKADAŞIM' id4_drive_home.xml
            grep -q 'TV kanalı' id4_drive_home.xml
            # Mola-inspired graphic entry points in the real phone dashboard.
            grep -q 'YouTube' id4_drive_home.xml
            # Verify the brand-new responsive dashboard and companion entry.
            # Scroll until the real clickable UI label appears; no fixed HOME tap coordinates.
            for i in 1 2 3; do adb shell uiautomator dump /sdcard/id4_cockpit_ui.xml >/dev/null 2>&1 && adb pull /sdcard/id4_cockpit_ui.xml id4_cockpit_ui.xml >/dev/null 2>&1 && break; sleep 2; done
            grep -q 'YOL ARKADAŞIM' id4_cockpit_ui.xml
            grep -q 'SES OTURUMU' id4_cockpit_ui.xml
            # Navigate the real home UI and validate the unified companion center.
            for i in 1 2 3 4 5 6; do adb shell uiautomator dump /sdcard/id4_integration_button.xml >/dev/null 2>&1 && adb pull /sdcard/id4_integration_button.xml id4_integration_button.xml >/dev/null 2>&1; if [ -s id4_integration_button.xml ] && grep -q 'UYGULAMALAR' id4_integration_button.xml; then break; fi; adb shell input swipe 540 1570 540 700 390; sleep 1; done
            grep -q 'UYGULAMALAR' id4_integration_button.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET;root=ET.parse("id4_integration_button.xml").getroot();matches=[n.attrib.get("bounds","") for n in root.iter("node") if "UYGULAMALAR" in n.attrib.get("text","")];assert matches,"Integration center button missing";v=list(map(int,re.findall(r"\d+",matches[0])));subprocess.run(["adb","shell","input","tap",str((v[0]+v[2])//2),str((v[1]+v[3])//2)],check=True)'
            sleep 3
            for i in 1 2 3; do adb shell uiautomator dump /sdcard/id4_integration_result.xml >/dev/null 2>&1 && adb pull /sdcard/id4_integration_result.xml id4_integration_result.xml >/dev/null 2>&1 && break; sleep 2; done
            grep -q 'ORTAK ENTEGRASYON MERKEZİ' id4_integration_result.xml
            adb shell screencap -p /sdcard/id4_integration_result.png
            adb pull /sdcard/id4_integration_result.png id4_integration_result.png
            adb shell input keyevent KEYCODE_BACK
            adb shell input tap 406 2250
            sleep 3
            adb shell screencap -p /sdcard/id4_tv.png
            adb pull /sdcard/id4_tv.png id4_tv.png
            # TV controls can be beneath the video, web shortcuts and fold.
            # Search the actual visible hierarchy instead of assuming one swipe.
            for i in 1 2 3 4 5 6 7 8; do adb shell uiautomator dump /sdcard/id4_tv_diagnostics_ui.xml >/dev/null; adb pull /sdcard/id4_tv_diagnostics_ui.xml id4_tv_diagnostics_ui.xml >/dev/null; if grep -q 'Yayın performansı' id4_tv_diagnostics_ui.xml; then break; fi; adb shell input swipe 540 1670 540 520 380; sleep 1; done
            grep -q 'Yayın performansı' id4_tv_diagnostics_ui.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET;root=ET.parse("id4_tv_diagnostics_ui.xml").getroot();matches=[n.attrib.get("bounds","") for n in root.iter("node") if "Yayın performansı" in n.attrib.get("text","")];assert matches,"IPTV performans raporu düğmesi bulunamadı";box=list(map(int,re.findall(r"\d+",matches[0])));subprocess.run(["adb","shell","input","tap",str((box[0]+box[2])//2),str((box[1]+box[3])//2)],check=True)'
            sleep 2
            adb shell uiautomator dump /sdcard/id4_iptv_report.xml
            adb pull /sdcard/id4_iptv_report.xml id4_iptv_report.xml
            grep -q 'IPTV performans raporu' id4_iptv_report.xml
            grep -q 'Tamponlama' id4_iptv_report.xml
            adb shell screencap -p /sdcard/id4_iptv_report.png
            adb pull /sdcard/id4_iptv_report.png id4_iptv_report.png
            adb shell input keyevent KEYCODE_BACK
            adb shell input tap 680 2250
            sleep 6
            adb shell screencap -p /sdcard/id4_radio.png
            adb pull /sdcard/id4_radio.png id4_radio.png
            adb shell uiautomator dump /sdcard/id4_ui.xml || true
            adb pull /sdcard/id4_ui.xml id4_ui.xml || true
            # Open the non-exported browser through the actual TV UI, not via adb am.
            adb shell input tap 406 2250
            sleep 3
            adb shell uiautomator dump /sdcard/id4_tv_browser.xml
            adb pull /sdcard/id4_tv_browser.xml id4_tv_browser.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET;root=ET.parse("id4_tv_browser.xml").getroot();matches=[n.attrib.get("bounds","") for n in root.iter("node") if "Web Medya" in n.attrib.get("text","")];assert matches,"TV ekranında Web Medya düğmesi bulunamadı";m=list(map(int,re.findall(r"\d+",matches[0])));subprocess.run(["adb","shell","input","tap",str((m[0]+m[2])//2),str((m[1]+m[3])//2)],check=True)'
            sleep 6
            adb shell dumpsys activity activities > id4_browser_activity.txt
            grep -q 'MediaWebActivity' id4_browser_activity.txt
            # Verify the three distinct on-device streaming history entry points.
            adb shell uiautomator dump /sdcard/id4_youtube_history_button.xml >/dev/null
            adb pull /sdcard/id4_youtube_history_button.xml id4_youtube_history_button.xml >/dev/null
            grep -q 'YT◷' id4_youtube_history_button.xml
            grep -q 'V◷' id4_youtube_history_button.xml
            grep -q 'P◷' id4_youtube_history_button.xml
            grep -q 'Prime Video' id4_youtube_history_button.xml
            adb shell screencap -p /sdcard/id4_web_media.png
            adb pull /sdcard/id4_web_media.png id4_web_media.png
            adb shell input tap 500 195
            sleep 2
            adb shell screencap -p /sdcard/id4_web_media_tabs.png
            adb pull /sdcard/id4_web_media_tabs.png id4_web_media_tabs.png
            # Confirm that HTTPS handoff button exists; on this phone emulator
            # AABrowser is intentionally absent, so the app must show a clear
            # error rather than sending the URL to an arbitrary browser.
            for i in 1 2 3 4 5; do adb shell uiautomator dump /sdcard/id4_handoff_ui.xml >/dev/null && adb pull /sdcard/id4_handoff_ui.xml id4_handoff_ui.xml >/dev/null && break; sleep 2; done
            test -s id4_handoff_ui.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET;r=ET.parse("id4_handoff_ui.xml").getroot();m=[n.attrib.get("bounds","") for n in r.iter("node") if "AABrowser" in n.attrib.get("text","")];assert m,"AABrowser handoff button missing";b=list(map(int,re.findall(r"\d+",m[0])));subprocess.run(["adb","shell","input","tap",str((b[0]+b[2])//2),str((b[1]+b[3])//2)],check=True)'
            sleep 2
            adb shell uiautomator dump /sdcard/id4_handoff_result.xml >/dev/null
            adb pull /sdcard/id4_handoff_result.xml id4_handoff_result.xml >/dev/null
            grep -q 'AABrowser bulunamadı' id4_handoff_result.xml
            adb shell input keyevent KEYCODE_BACK
            # Verify Media3 audio library API through the real phone UI.
            # This does NOT represent an Android Auto vehicle connection.
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell input tap 936 2250
            sleep 2
            # android-emulator-runner executes each physical script line separately;
            # keep shell control-flow in a single line to preserve loop syntax.
            for i in 1 2 3 4 5 6 7 8; do adb shell uiautomator dump /sdcard/id4_library_probe_ui.xml >/dev/null; adb pull /sdcard/id4_library_probe_ui.xml id4_library_probe_ui.xml >/dev/null; if grep -q 'Ses kitaplığı API bağlantısını kontrol et' id4_library_probe_ui.xml; then break; fi; adb shell input swipe 540 1670 540 540 380; sleep 1; done
            grep -q 'Ses kitaplığı API bağlantısını kontrol et' id4_library_probe_ui.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET;root=ET.parse("id4_library_probe_ui.xml").getroot();matches=[n.attrib.get("bounds","") for n in root.iter("node") if "Ses kitaplığı API" in n.attrib.get("text","")];assert matches,"Ses API testi bulunamadı";b=list(map(int,re.findall(r"\d+",matches[0])));subprocess.run(["adb","shell","input","tap",str((b[0]+b[2])//2),str((b[1]+b[3])//2)],check=True)'
            sleep 12
            adb shell uiautomator dump /sdcard/id4_library_probe_result.xml >/dev/null
            adb pull /sdcard/id4_library_probe_result.xml id4_library_probe_result.xml >/dev/null
            grep -q 'TELEFON İÇİ SES KÜTÜPHANESİ: BAĞLANDI' id4_library_probe_result.xml
            # Legacy platform MediaBrowser verifies the Android Auto-compatible service entry.
            # This remains a phone-emulator transport test, NOT an ID.4 head-unit test.
            grep -q 'ESKİ ANDROID MEDIABROWSER: BAĞLANDI' id4_library_probe_result.xml
            adb shell screencap -p /sdcard/id4_library_probe_result.png
            adb pull /sdcard/id4_library_probe_result.png id4_library_probe_result.png
            adb shell input keyevent KEYCODE_BACK
            sleep 1
            # The optional companion bridge is READ-ONLY: no Shizuku API grant or
            # Android Auto bypass is attempted on the stock Android 15 emulator.
            for i in 1 2 3 4 5; do adb shell uiautomator dump /sdcard/id4_companions_ui.xml >/dev/null; adb pull /sdcard/id4_companions_ui.xml id4_companions_ui.xml >/dev/null; if grep -q 'Shizuku / AAAD / Fermata' id4_companions_ui.xml; then break; fi; adb shell input swipe 540 610 540 1620 330; sleep 1; done
            grep -q 'Shizuku / AAAD / Fermata' id4_companions_ui.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET;root=ET.parse("id4_companions_ui.xml").getroot();matches=[n.attrib.get("bounds","") for n in root.iter("node") if "Shizuku / AAAD / Fermata" in n.attrib.get("text","")];assert matches,"Companion diagnostics button missing";b=list(map(int,re.findall(r"\d+",matches[0])));subprocess.run(["adb","shell","input","tap",str((b[0]+b[2])//2),str((b[1]+b[3])//2)],check=True)'
            sleep 2
            adb shell uiautomator dump /sdcard/id4_companions_result.xml >/dev/null
            adb pull /sdcard/id4_companions_result.xml id4_companions_result.xml >/dev/null
            grep -q 'SHIZUKU / AAAD / FERMATA' id4_companions_result.xml
            grep -q 'Kurulu görünmüyor' id4_companions_result.xml
            adb shell screencap -p /sdcard/id4_companions_result.png
            adb pull /sdcard/id4_companions_result.png id4_companions_result.png
            adb logcat -d -s AndroidRuntime:E > android_runtime_errors.log
            cat android_runtime_errors.log
            if grep -q 'FATAL EXCEPTION' android_runtime_errors.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-smoke
          path: |
            id4_home.png
            id4_youtube_history_button.xml
            id4_cockpit_ui.xml
            id4_drive_home.xml
            id4_integration_button.xml
            id4_integration_result.xml
            id4_integration_result.png
            id4_tv.png
            id4_tv_diagnostics_ui.xml
            id4_iptv_report.xml
            id4_iptv_report.png
            id4_radio.png
            id4_web_media.png
            id4_web_media_tabs.png
            id4_handoff_ui.xml
            id4_handoff_result.xml
            id4_tv_browser.xml
            id4_browser_activity.txt
            id4_library_probe_ui.xml
            id4_library_probe_result.xml
            id4_library_probe_result.png
            id4_companions_ui.xml
            id4_companions_result.xml
            id4_companions_result.png
            id4_ui.xml
            android_runtime_errors.log
          retention-days: 7
