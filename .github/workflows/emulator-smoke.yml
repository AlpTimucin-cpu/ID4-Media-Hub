name: Android emulator launch smoke test
on:
  workflow_dispatch:
  push:
    branches: [main, feature/fermata-style-car-video]
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - 'app/**'
permissions:
  contents: read
jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build application
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Boot emulator and open app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n tr.id4.mediahub/.MainActivity
            sleep 10
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|tr.id4.mediahub' | head -20 || true
            adb shell screencap -p /sdcard/id4_home.png
            adb pull /sdcard/id4_home.png id4_home.png
            adb shell input tap 406 2250
            sleep 3
            adb shell screencap -p /sdcard/id4_tv.png
            adb pull /sdcard/id4_tv.png id4_tv.png
            adb shell input tap 680 2250
            sleep 6
            adb shell screencap -p /sdcard/id4_radio.png
            adb pull /sdcard/id4_radio.png id4_radio.png
            adb shell uiautomator dump /sdcard/id4_ui.xml || true
            adb pull /sdcard/id4_ui.xml id4_ui.xml || true
            adb shell am start -W -n tr.id4.mediahub/.MediaWebActivity --es web_media_url 'https://m.youtube.com'
            sleep 6
            adb shell screencap -p /sdcard/id4_web_media.png
            adb pull /sdcard/id4_web_media.png id4_web_media.png
            adb shell input tap 500 195
            sleep 2
            adb shell screencap -p /sdcard/id4_web_media_tabs.png
            adb pull /sdcard/id4_web_media_tabs.png id4_web_media_tabs.png
            adb logcat -d -s AndroidRuntime:E > android_runtime_errors.log
            cat android_runtime_errors.log
            if grep -q 'FATAL EXCEPTION' android_runtime_errors.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-smoke
          path: |
            id4_home.png
            id4_tv.png
            id4_radio.png
            id4_web_media.png
            id4_web_media_tabs.png
            id4_ui.xml
            android_runtime_errors.log
          retention-days: 7
