name: Android emulator launch smoke test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main, feature/fermata-style-car-video]
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - 'app/**'
      - '.github/scripts/mola-smoke.sh'
      - '.github/scripts/prepare-bundled-m3u.sh'
permissions:
  contents: read
jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bundle the exact owner-provided filmler_full.m3u
        shell: bash
        run: bash .github/scripts/prepare-bundled-m3u.sh
      - name: Build application
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM and reclaim runner disk space
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          # Android 15 emulator requires ~7.4 GB free for userdata creation.
          # The hosted image contains tools unrelated to this Android build.
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h "$HOME"
      - name: Boot emulator and open app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Pixel 6 profile otherwise asks for ~7.4GB userdata while the
          # hosted runner may have only ~7.1GB free (FATAL during AVD boot).
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -partition-size 2048
          script: bash .github/scripts/mola-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-smoke
          path: |
            id4_home.png
            id4_home_movie.xml
            id4_movie.xml
            id4_movie.png
            id4_offline_player.xml
            id4_offline_player.png
            id4_movie_detail.xml
            id4_movie_detail.png
            android_runtime_errors.log
          retention-days: 7
