name: EV Cockpit - Native Gitleaks security gate

on:
  pull_request:
  push:
    branches:
      - feature/ev-cockpit
      - 'feature/phase1-*'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan all reachable Git history (recommended once after the incident)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout with history (without token persistence)
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select commit range, with full-history fail-closed fallback
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          FULL_HISTORY: ${{ inputs.full_history || false }}
        run: |
          set -euo pipefail
          scan='--all'
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$FULL_HISTORY" == 'true' ]]; then
            echo 'Manual full-history scan requested.'
          else
            base=''
            if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
              base="$PR_BASE_SHA"
            elif [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
              base="$PUSH_BEFORE_SHA"
            fi
            if [[ "$base" =~ ^[0-9a-f]{40}$ ]] &&
               [[ "$base" != '0000000000000000000000000000000000000000' ]] &&
               git cat-file -e "${base}^{commit}" 2>/dev/null; then
              scan="${base}..HEAD"
              echo 'Scanning new changes from the event base SHA.'
            else
              echo '::notice::Base commit unavailable; scanning full reachable history.'
            fi
          fi
          printf 'GITLEAKS_LOG_OPTS=%s\n' "$scan" >> "$GITHUB_ENV"

      - name: Scan Git patches with pinned Gitleaks v8.30.1 container
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --workdir /repo \
            "$image" git /repo \
            --log-opts="$GITLEAKS_LOG_OPTS" \
            --redact=100 --no-banner --exit-code=1
          echo 'PASS: no configured Git secret signatures in selected commit range.'
