name: Legacy source ZIP importer (retired)

# Removed: the importer expected a missing ZIP and could overwrite source
# on main with contents: write. Source migrations require reviewed PRs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Legacy automatic ZIP importer disabled. Use a reviewed source PR.'
