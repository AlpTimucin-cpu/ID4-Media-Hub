name: Legacy source ZIP import (retired)

# No longer safe: the old ZIP was never an authoritative Gradle source tree,
# and the historic workflow could push extracted files directly to main.
# Retained only as an inert audit record.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Disabled. Use reviewed source-controlled Gradle projects.'
