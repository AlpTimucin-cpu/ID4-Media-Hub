name: Native Cockpit · Kotlin Compose APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mola-native-id4
    paths:
      - "nativecockpit/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build-nativecockpit.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify preinstalled Android SDK on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          echo "SDK: ${ANDROID_HOME:-unset}"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          "$sdkmanager_bin" --version
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Native Cockpit unit tests
        run: gradle :nativecockpit:testDebugUnitTest --stacktrace --no-daemon
      - name: Compile native debug APK
        run: gradle :nativecockpit:assembleDebug --stacktrace --no-daemon
      - name: Verify APK exists
        run: |
          set -euo pipefail
          apk="nativecockpit/build/outputs/apk/debug/nativecockpit-debug.apk"
          test -s "$apk"
          sha256sum "$apk" > nativecockpit-debug.sha256
          ls -lh "$apk"
      - name: Verify Android Auto navigation service and OBD permissions in APK
        shell: bash
        run: |
          set -euo pipefail
          apk="nativecockpit/build/outputs/apk/debug/nativecockpit-debug.apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$aapt"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > manifest-tree.txt
          grep -q 'androidx.car.app.CarAppService' manifest-tree.txt
          grep -q 'androidx.car.app.category.NAVIGATION' manifest-tree.txt
          grep -q 'android.permission.BLUETOOTH_CONNECT' manifest-tree.txt
          echo "APK includes Android Auto navigation service and paired Bluetooth permission"
      - name: Publish test APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Elektrikli-Yol-Arkadasim-Native-Kotlin-Debug-APK
          path: |
            nativecockpit/build/outputs/apk/debug/nativecockpit-debug.apk
            nativecockpit-debug.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    # Release is explicit. Push/PR CI never publishes a production-signed binary.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Validate owner-provided signing credentials
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EYA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EYA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EYA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EYA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing EYA_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing EYA_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing EYA_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing EYA_RELEASE_KEY_PASSWORD"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eya-release.jks"
          test -s "$RUNNER_TEMP/eya-release.jks"
      - name: Compile signed and R8-minified release APK
        shell: bash
        env:
          EYA_RELEASE_STORE_FILE: ${{ runner.temp }}/eya-release.jks
          EYA_RELEASE_STORE_PASSWORD: ${{ secrets.EYA_RELEASE_STORE_PASSWORD }}
          EYA_RELEASE_KEY_ALIAS: ${{ secrets.EYA_RELEASE_KEY_ALIAS }}
          EYA_RELEASE_KEY_PASSWORD: ${{ secrets.EYA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :nativecockpit:testDebugUnitTest :nativecockpit:assembleRelease --stacktrace --no-daemon
      - name: Verify APK signing and package identity
        shell: bash
        run: |
          set -euo pipefail
          apk="nativecockpit/build/outputs/apk/release/nativecockpit-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            grep -q "package: name='tr.id4.mediahub.nativecockpit'"
          sha256sum "$apk" > nativecockpit-release.sha256
          ls -lh "$apk"
      - name: Publish production-signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Elektrikli-Yol-Arkadasim-Native-Signed-Release-APK
          path: |
            nativecockpit/build/outputs/apk/release/nativecockpit-release.apk
            nativecockpit-release.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/eya-release.jks"
