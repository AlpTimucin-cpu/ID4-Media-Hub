name: EV Cockpit · Verified Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/ev-cockpit
  push:
    branches:
      - feature/ev-cockpit

# One build per branch; outdated pushes are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Kotlin tests and Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify official Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -Fq 'gradle-8.14.3-bin.zip' gradle/wrapper/gradle-wrapper.properties
          test "$(git hash-object gradle/wrapper/gradle-wrapper.jar)" = \
            '1b33c55baabb587c669f562ae36f953de2481846'
          ./gradlew --version --no-daemon
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Static production source checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_cockpit_radio_media_map_release.py
          python3 scripts/audit_branding.py
          python3 scripts/check_welcome_greeting.py
          python3 scripts/check_production_hardware.py
          python3 scripts/check_final_release_hardening.py
      - name: Compile and test native cockpit
        run: ./gradlew :nativecockpit:testDebugUnitTest :nativecockpit:assembleDebug --stacktrace --no-daemon
      - name: Verify APK package and save checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=nativecockpit/build/outputs/apk/debug/nativecockpit-debug.apk
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.evcockpit'"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/cockpit-manifest.txt"
          grep -q 'androidx.car.app.CarAppService' "$RUNNER_TEMP/cockpit-manifest.txt"
          grep -q 'android.permission.BLUETOOTH_CONNECT' "$RUNNER_TEMP/cockpit-manifest.txt"
          sha256sum "$apk" > nativecockpit-debug.sha256
          echo 'Debug APK verified. No production key was supplied.'
      - name: Publish Debug APK and SHA-256
        uses: actions/upload-artifact@v6
        with:
          name: EV-Cockpit-Native-Kotlin-Debug-APK
          path: |
            nativecockpit/build/outputs/apk/debug/nativecockpit-debug.apk
            nativecockpit-debug.sha256
          if-no-files-found: error
          retention-days: 14
