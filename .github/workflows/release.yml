
name: EV Cockpit - Signed GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Enter v1.0.0, latest, or leave blank to select the next available tag.'
        required: false
        type: string
        default: 'latest'
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: 'latest'
      allow_temporary_signing:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ev-cockpit-releases
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout maintained EV Cockpit sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name || 'main' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Resolve Android source branch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f nativecockpit/build.gradle.kts ]; then
            echo '::notice::SeÃ§ili dalda nativecockpit yok; feature/ev-cockpit dalÄ±ndan derleme yapÄ±lacak.'
            if git show-ref --verify --quiet refs/remotes/origin/feature/ev-cockpit; then
              git switch -C feature/ev-cockpit origin/feature/ev-cockpit
            else
              echo '::error title=HATA::nativecockpit/build.gradle.kts ve feature/ev-cockpit dalÄ± bulunamadÄ±.'
              exit 1
            fi
          fi
          test -f nativecockpit/build.gradle.kts || {
            echo '::error title=HATA::Android modÃ¼lÃ¼ bulunamadÄ±.'
            exit 1
          }
          echo "OK: Derleme kaynak dalÄ± $(git branch --show-current)"

      - name: Update version in Gradle
        shell: bash
        env:
          REQ_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$REQ_TAG" = "latest" ] || [ -z "$REQ_TAG" ]; then
            VERSION="1.0.1"
          else
            VERSION="${REQ_TAG#v}"
          fi
          echo "Derlenecek Sürüm: $VERSION"
          echo "RELEASE_TAG=v$VERSION" >> $GITHUB_ENV
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/g" nativecockpit/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager_bin="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -path '*/bin/sdkmanager' \
              -print -quit
          )"

          if [ -z "$sdkmanager_bin" ]; then
            echo 'HATA: Android SDK bulunamadÄ±.'
            exit 1
          fi

          "$sdkmanager_bin" \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
          cache-provider: basic

      - name: Check signing secret availability
        shell: bash
        env:
          BUNDLE: ${{ secrets.EYA_SIGNING_BUNDLE_BASE64 }}
          ALLOW_TEMPORARY: ${{ inputs.allow_temporary_signing }}
        run: |
          if [ -z "${BUNDLE//[[:space:]]/}" ] \
             && [ "$ALLOW_TEMPORARY" != "true" ]; then

            echo '::error title=HATA::Secret bulunamadÄ± veya boÅŸ: EYA_SIGNING_BUNDLE_BASE64'
            exit 1
          fi

          echo 'OK: Ä°mzalama giriÅŸi doÄŸrulandÄ±.'
          echo 'Gizli anahtar loglara yazdÄ±rÄ±lmadÄ±.'

      - name: Restore single signing bundle or generate test key
        shell: bash
        env:
          EYA_SIGNING_BUNDLE_BASE64: ${{ secrets.EYA_SIGNING_BUNDLE_BASE64 }}
          ALLOW_TEMPORARY: ${{ inputs.allow_temporary_signing }}
        run: |
          set -euo pipefail
          umask 077

          python3 - <<'PY'
          import base64
          import binascii
          import hashlib
          import json
          import os
          import pathlib
          import secrets
          import subprocess

          path = (
              pathlib.Path(
                  os.environ['RUNNER_TEMP']
              ) / 'release.jks'
          )

          # Remove whitespace and line breaks.
          encoded = ''.join(
              os.environ.get(
                  'EYA_SIGNING_BUNDLE_BASE64', ''
              ).split()
          )

          if encoded:
              try:
                  if encoded.startswith('{'):
                      bundle = json.loads(
                          os.environ['EYA_SIGNING_BUNDLE_BASE64'].strip()
                      )
                  else:
                      decoded = base64.b64decode(encoded, validate=True)
                      bundle = json.loads(decoded.decode('utf-8'))
              except (ValueError, UnicodeError, binascii.Error) as error:
                  print(
                      '::error title=HATA::Secret JSON formatÄ±nda deÄŸil. '
                      'LÃ¼tfen generate-keystore Ã§Ä±ktÄ±sÄ±nÄ± kullanÄ±n.'
                  )
                  raise SystemExit(1) from error

              if not isinstance(bundle, dict):
                  print('::error title=HATA::Secret JSON nesnesi deÄŸil.')
                  raise SystemExit(1)

              if bundle.get('schema') != 'eya-signing-v1':
                  raise SystemExit(
                      'HATA: Ä°mzalama paketi ÅŸemasÄ± '
                      'geÃ§ersiz.'
                  )

              try:
                  raw = base64.b64decode(
                      ''.join(
                          bundle[
                              'keystore_base64'
                          ].split()
                      ),
                      validate=True
                  )
              except (KeyError, TypeError, ValueError, binascii.Error) as error:
                  raise SystemExit(
                      'HATA: keystore_base64 '
                      'alanÄ± eksik veya hatalÄ±.'
                  ) from error

              actual_sha = hashlib.sha256(
                  raw
              ).hexdigest()

              expected_sha = bundle.get(
                  'keystore_sha256'
              )

              if actual_sha != expected_sha:
                  raise SystemExit(
                      'HATA: Keystore SHA-256 '
                      'doÄŸrulamasÄ± baÅŸarÄ±sÄ±z.'
                  )

              path.write_bytes(raw)

              try:
                  password = bundle[
                      'store_password'
                  ]
                  keypass = bundle[
                      'key_password'
                  ]
                  alias = bundle[
                      'key_alias'
                  ]
              except KeyError as error:
                  raise SystemExit(
                      'HATA: Ä°mzalama paketi '
                      'ÅŸifre veya alias alanÄ± eksik.'
                  ) from error

              mode = 'permanent'

          elif os.environ.get(
              'ALLOW_TEMPORARY'
          ) == 'true':

              password = secrets.token_urlsafe(
                  36
              )
              keypass = password
              alias = 'evcockpit-temporary'

              env = dict(
                  os.environ,
                  EYA_TEMP_PASS=password
              )

              subprocess.run(
                  [
                      'keytool',
                      '-genkeypair',
                      '-noprompt',
                      '-storetype',
                      'JKS',
                      '-keystore',
                      str(path),
                      '-storepass:env',
                      'EYA_TEMP_PASS',
                      '-keypass:env',
                      'EYA_TEMP_PASS',
                      '-alias',
                      alias,
                      '-keyalg',
                      'RSA',
                      '-keysize',
                      '3072',
                      '-validity',
                      '10000',
                      '-dname',
                      'CN=EV Cockpit Temporary Test Signing, C=TR'
                  ],
                  check=True,
                  env=env,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              mode = 'temporary'

              print(
                  'UYARI: GeÃ§ici imzalama '
                  'anahtarÄ± oluÅŸturuldu.'
              )

          else:
              raise SystemExit(
                  'HATA: Secret bulunamadÄ± '
                  'veya boÅŸ: '
                  'EYA_SIGNING_BUNDLE_BASE64'
              )

          path.chmod(0o600)

          values = {
              'EYA_RELEASE_STORE_FILE':
                  str(path),
              'EYA_RELEASE_STORE_PASSWORD':
                  password,
              'EYA_RELEASE_KEY_ALIAS':
                  alias,
              'EYA_RELEASE_KEY_PASSWORD':
                  keypass,
              'SIGNING_MODE':
                  mode,
          }

          for key, value in values.items():
              if (
                  not isinstance(value, str)
                  or not value
                  or '\n' in value
                  or '\r' in value
              ):
                  raise SystemExit(
                      'HATA: Ä°mzalama alanÄ± geÃ§ersiz: '
                      + key
                  )

          for secret in (
              password,
              keypass
          ):
              print(
                  '::add-mask::' + secret
              )

          with open(
              os.environ['GITHUB_ENV'],
              'a',
              encoding='utf-8'
          ) as envfile:

              for key, value in values.items():
                  envfile.write(
                      key + '=' + value + '\n'
                  )

          print(
              'OK: Ä°mzalama modu:',
              mode
          )
          PY

      - name: Check decoded keystore and alias
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$EYA_RELEASE_STORE_FILE" ]; then
            echo '::error title=HATA::release.jks dosyasÄ± eksik veya boÅŸ.'
            exit 1
          fi

          if ! keytool -list \
               -keystore "$EYA_RELEASE_STORE_FILE" \
               -storepass:env EYA_RELEASE_STORE_PASSWORD \
               -alias "$EYA_RELEASE_KEY_ALIAS" \
               >/dev/null 2>&1; then

            echo '::error title=HATA::Keystore ÅŸifresi, alias veya JKS dosyasÄ± hatalÄ±.'
            exit 1
          fi

          echo 'OK: Keystore ve alias doÄŸrulandÄ±.'

      - name: Run tests and build R8-optimized signed APK
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_production_hardware.py

          python3 scripts/check_final_release_hardening.py

          python3 scripts/check_welcome_greeting.py

          gradle \
            :nativecockpit:testDebugUnitTest \
            :nativecockpit:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify signing identity, APK, and checksum
        shell: bash
        run: |
          set -euo pipefail

          apk='nativecockpit/build/outputs/apk/release/nativecockpit-release.apk'

          if [ ! -s "$apk" ]; then
            echo '::error title=HATA::Release APK bulunamadÄ±.'
            exit 1
          fi

          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$signer" verify --verbose "$apk"

          "$signer" verify --print-certs "$apk" \
            > "$RUNNER_TEMP/apk-certs.txt"

          keytool -exportcert \
            -keystore "$EYA_RELEASE_STORE_FILE" \
            -storepass:env EYA_RELEASE_STORE_PASSWORD \
            -alias "$EYA_RELEASE_KEY_ALIAS" \
            -file "$RUNNER_TEMP/expected-cert.der" \
            >/dev/null

          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re

          tmp = pathlib.Path(
              os.environ['RUNNER_TEMP']
          )

          output = (
              tmp / 'apk-certs.txt'
          ).read_text()

          match = re.search(
              r'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F:]+)',
              output
          )

          if not match:
              raise SystemExit(
                  'HATA: APK imza bilgisi bulunamadÄ±.'
              )

          got = match.group(1).replace(
              ':', ''
          ).lower()

          expected = hashlib.sha256(
              (
                  tmp / 'expected-cert.der'
              ).read_bytes()
          ).hexdigest()

          if got != expected:
              raise SystemExit(
                  'HATA: APK sertifikasÄ± '
                  'keystore sertifikasÄ±yla eÅŸleÅŸmiyor.'
              )

          print(
              'OK: APK imzasÄ± doÄŸrulandÄ±.'
          )
          PY

          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"

          "$aapt" dump badging "$apk" \
            | grep -q "package: name='com.evcockpit'"

          mkdir -p dist

          cp "$apk" \
            "dist/EV-Cockpit-${RELEASE_TAG}.apk"

          (
            cd dist
            sha256sum \
              "EV-Cockpit-${RELEASE_TAG}.apk" \
              > "EV-Cockpit-${RELEASE_TAG}.apk.sha256"
          )

          {
            echo "# EV Cockpit ${RELEASE_TAG}"
            echo
            echo 'Signed R8-optimized Android build.'
            echo 'Automated checks completed.'

            if [ "$SIGNING_MODE" = temporary ]; then
              echo 'TEMPORARY KEY: Fresh-install test prerelease.'
            else
              echo 'PERMANENT KEY: Signed with the configured owner key.'
            fi

            echo 'Physical-device validation is still required.'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish APK on GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_SHA }}
          name: EV Cockpit ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ env.SIGNING_MODE == 'temporary' }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/EV-Cockpit-*.apk
            dist/EV-Cockpit-*.apk.sha256

      - name: Delete sensitive temporary files
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/release.jks" \
            "$RUNNER_TEMP/apk-certs.txt" \
            "$RUNNER_TEMP/expected-cert.der" \
            "$RUNNER_TEMP/release-notes.md"
