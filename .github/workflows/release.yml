name: EV Cockpit - Signed GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version tag, e.g. v1.0.0. Leave blank for automatic version.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ''
      allow_temporary_signing:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ev-cockpit-releases
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout maintained EV Cockpit sources
        uses: actions/checkout@v6
        with:
          ref: feature/ev-cockpit
          persist-credentials: false

      - name: Select unique release version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          p = pathlib.Path('nativecockpit/build.gradle.kts')
          src = p.read_text(encoding='utf-8')
          ver = re.search(r'(?m)^([ \t]*versionName[ \t]*=[ \t]*)"(\d+)\.(\d+)\.(\d+)"[ \t]*$', src)
          code = re.search(r'(?m)^([ \t]*versionCode[ \t]*=[ \t]*)(\d+)[ \t]*$', src)
          if not ver or not code:
              raise SystemExit('Expected numeric versionName and versionCode in nativecockpit')

          major, minor, patch = (int(ver.group(i)) for i in (2, 3, 4))
          requested = os.environ.get('REQUESTED_TAG', '').strip()
          if requested and not re.fullmatch(r'v\d+\.\d+\.\d+', requested):
              raise SystemExit('Requested tag must look like v1.0.0')

          def exists(tag):
              result = subprocess.run(['git', 'ls-remote', '--tags', '--exit-code',
                                       'origin', 'refs/tags/' + tag],
                                      capture_output=True, text=True)
              if result.returncode not in (0, 2):
                  raise SystemExit('Could not check existing remote tags: ' + result.stderr)
              return result.returncode == 0

          if requested:
              tag = requested
              if exists(tag):
                  raise SystemExit('Release tag already exists: ' + tag)
          else:
              tag = f'v{major}.{minor}.{patch}'
              if exists(tag):
                  candidate = patch + int(os.environ['RUN_NUMBER'])
                  for _ in range(100):
                      tag = f'v{major}.{minor}.{candidate}'
                      if not exists(tag):
                          break
                      candidate += 1
                  else:
                      raise SystemExit('No unused release tag found')

          version = tag[1:]
          vm, vn, vp = map(int, version.split('.'))
          if vm > 199 or vn > 999 or vp > 9999:
              raise SystemExit('Version segments exceed Android versionCode encoding limits')
          new_code = vm * 10000000 + vn * 10000 + vp
          if not (0 < new_code < 2100000000):
              raise SystemExit('Android versionCode limit exceeded')
          src = src[:ver.start(0)] + ver.group(1) + '"' + version + '"' + src[ver.end(0):]
          code = re.search(r'(?m)^([ \t]*versionCode[ \t]*=[ \t]*)(\d+)[ \t]*$', src)
          src = src[:code.start(0)] + code.group(1) + str(new_code) + src[code.end(0):]
          p.write_text(src, encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'RELEASE_TAG={tag}\n')
              f.write(f'SOURCE_SHA={subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()}\n')
          print('Selected release:', tag, 'versionCode:', new_code)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
          cache-provider: basic

      - name: Restore single signing bundle or generate test key
        shell: bash
        env:
          EYA_SIGNING_BUNDLE_BASE64: ${{ secrets.EYA_SIGNING_BUNDLE_BASE64 }}
          ALLOW_TEMPORARY: ${{ inputs.allow_temporary_signing }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, secrets, subprocess
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'keystore.jks'
          encoded = os.environ.get('EYA_SIGNING_BUNDLE_BASE64', '').strip()
          if encoded:
              bundle = json.loads(base64.b64decode(encoded, validate=True).decode('utf-8'))
              if bundle.get('schema') != 'eya-signing-v1':
                  raise SystemExit('Unsupported signing bundle format')
              raw = base64.b64decode(bundle['keystore_base64'], validate=True)
              if hashlib.sha256(raw).hexdigest() != bundle['keystore_sha256']:
                  raise SystemExit('Signing bundle checksum mismatch')
              path.write_bytes(raw)
              password = bundle['store_password']
              keypass = bundle['key_password']
              alias = bundle['key_alias']
              mode = 'permanent'
          elif os.environ.get('ALLOW_TEMPORARY') == 'true':
              password = secrets.token_urlsafe(36)
              keypass = password
              alias = 'evcockpit-temporary'
              env = dict(os.environ, EYA_TEMP_PASS=password)
              subprocess.run([
                  'keytool', '-genkeypair', '-noprompt', '-storetype', 'JKS',
                  '-keystore', str(path), '-storepass:env', 'EYA_TEMP_PASS',
                  '-keypass:env', 'EYA_TEMP_PASS', '-alias', alias,
                  '-keyalg', 'RSA', '-keysize', '3072', '-validity', '10000',
                  '-dname', 'CN=EV Cockpit Temporary Test Signing, C=TR',
              ], check=True, env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              mode = 'temporary'
              print('::warning::A temporary signing key was generated. This APK cannot update an app signed with another key.')
          else:
              raise SystemExit('EYA_SIGNING_BUNDLE_BASE64 is missing. Use Auto-Release for a temporary test build, or configure the single permanent secret.')

          path.chmod(0o600)
          values = {
              'EYA_RELEASE_STORE_FILE': str(path),
              'EYA_RELEASE_STORE_PASSWORD': password,
              'EYA_RELEASE_KEY_ALIAS': alias,
              'EYA_RELEASE_KEY_PASSWORD': keypass,
              'SIGNING_MODE': mode,
          }
          for key, value in values.items():
              if not isinstance(value, str) or not value or '\n' in value or '\r' in value:
                  raise SystemExit('Invalid signing bundle field: ' + key)
          for secret in (password, keypass):
              print('::add-mask::' + secret)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as envfile:
              for key, value in values.items():
                  envfile.write(key + '=' + value + '\n')
          print('Signing mode:', mode)
          PY

      - name: Run tests and build R8-optimized signed APK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_production_hardware.py
          python3 scripts/check_final_release_hardening.py
          python3 scripts/check_welcome_greeting.py
          keytool -list -keystore "$EYA_RELEASE_STORE_FILE" \
            -storepass:env EYA_RELEASE_STORE_PASSWORD \
            -alias "$EYA_RELEASE_KEY_ALIAS" >/dev/null
          gradle :nativecockpit:testDebugUnitTest :nativecockpit:assembleRelease \
            --no-daemon --stacktrace

      - name: Verify signing identity, APK, and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk='nativecockpit/build/outputs/apk/release/nativecockpit-release.apk'
          test -s "$apk"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify --verbose "$apk"
          "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certs.txt"
          keytool -exportcert -keystore "$EYA_RELEASE_STORE_FILE" \
            -storepass:env EYA_RELEASE_STORE_PASSWORD \
            -alias "$EYA_RELEASE_KEY_ALIAS" \
            -file "$RUNNER_TEMP/expected-cert.der" >/dev/null
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          output = (tmp / 'apk-certs.txt').read_text()
          match = re.search(r'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F:]+)', output)
          if not match:
              raise SystemExit('Could not locate APK signer certificate fingerprint')
          got = match.group(1).replace(':', '').lower()
          expected = hashlib.sha256((tmp / 'expected-cert.der').read_bytes()).hexdigest()
          if got != expected:
              raise SystemExit('APK signer does not match generated/restored keystore')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | \
            grep -q "package: name='com.evcockpit'"
          mkdir -p dist
          cp "$apk" "dist/EV-Cockpit-${RELEASE_TAG}.apk"
          (cd dist && sha256sum "EV-Cockpit-${RELEASE_TAG}.apk" > \
            "EV-Cockpit-${RELEASE_TAG}.apk.sha256")
          {
            echo "# EV Cockpit ${RELEASE_TAG}"
            echo
            echo 'Signed R8-optimized Android build. Automated checks passed.'
            if [ "$SIGNING_MODE" = temporary ]; then
              echo 'TEMPORARY KEY: Fresh-install test prerelease. Not compatible with previous signing identities.'
            else
              echo 'PERMANENT KEY: Signed with the configured repository owner key.'
            fi
            echo 'Physical-device validation (GPS/OBD/Android Auto) is still required.'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish APK on GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_SHA }}
          name: EV Cockpit ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ env.SIGNING_MODE == 'temporary' }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/EV-Cockpit-*.apk
            dist/EV-Cockpit-*.apk.sha256

      - name: Delete sensitive temporary files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/keystore.jks" "$RUNNER_TEMP/apk-certs.txt" \
                "$RUNNER_TEMP/expected-cert.der" "$RUNNER_TEMP/release-notes.md"
