name: EV Cockpit · Android visual QA
on:
  workflow_dispatch:
  push:
    branches: [feature/ev-cockpit]
    paths:
      - 'nativecockpit/**'
      - '.github/workflows/cockpit-visual-qa.yml'
      - '.github/scripts/cockpit-visual-qa.py'
permissions:
  contents: read
concurrency:
  group: cockpit-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install compilation SDK
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build native cockpit
        run: gradle :nativecockpit:testDebugUnitTest :nativecockpit:assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Start Android and verify cockpit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 .github/scripts/cockpit-visual-qa.py
      - name: Publish visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EV-Cockpit-Visual-QA
          path: build/cockpit-visual/
          if-no-files-found: warn
          retention-days: 7
