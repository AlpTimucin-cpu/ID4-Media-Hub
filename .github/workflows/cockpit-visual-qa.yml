name: EV Cockpit · Android visual QA
on:
  workflow_dispatch:
  push:
    branches: [feature/ev-cockpit]
    paths:
      - 'nativecockpit/**'
      - '.github/workflows/cockpit-visual-qa.yml'
      - '.github/scripts/cockpit-visual-qa.py'
permissions:
  contents: read
concurrency:
  group: cockpit-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install compilation SDK
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build native cockpit
        run: gradle :nativecockpit:testDebugUnitTest :nativecockpit:assembleDebug --no-daemon --stacktrace
      - name: Build Release for emulator QA with an ephemeral test key
        shell: bash
        run: |
          set -euo pipefail
          qa_key="$RUNNER_TEMP/cockpit-qa-only.jks"
          keytool -genkeypair -noprompt -keystore "$qa_key" -storetype JKS \
            -storepass android -keypass android -alias cockpit-qa \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Ephemeral Emulator QA"
          EYA_RELEASE_STORE_FILE="$qa_key" \
          EYA_RELEASE_STORE_PASSWORD=android \
          EYA_RELEASE_KEY_ALIAS=cockpit-qa \
          EYA_RELEASE_KEY_PASSWORD=android \
            gradle :nativecockpit:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            nativecockpit/build/outputs/apk/release/nativecockpit-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            nativecockpit/build/outputs/apk/release/nativecockpit-release.apk > "$RUNNER_TEMP/qa-release-badging.txt"
          if grep -q application-debuggable "$RUNNER_TEMP/qa-release-badging.txt"; then
            echo "::error::Release QA APK is unexpectedly debuggable"
            exit 1
          fi
          rm -f "$qa_key"
          echo 'Release emulator QA uses an ephemeral test certificate. No production Release APK is published by this workflow.' >> "$GITHUB_STEP_SUMMARY"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Start Android and verify cockpit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 .github/scripts/cockpit-visual-qa.py
      - name: Publish visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EV-Cockpit-Visual-QA
          path: build/cockpit-visual/
          if-no-files-found: warn
          retention-days: 7
