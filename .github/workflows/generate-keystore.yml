name: EV Cockpit - Generate Private Signing Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ev-cockpit-create-signing-key
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ensure secret export is private and not replacing an existing key
        shell: bash
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          EXISTING_BUNDLE: ${{ secrets.EYA_SIGNING_BUNDLE_BASE64 }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::Repository is PUBLIC. A signing-key artifact must not be published in a public repository. Temporarily make the repository private before running."
            exit 1
          fi
          if [ -n "$EXISTING_BUNDLE" ]; then
            echo "::error::The permanent signing secret already exists. Never generate a replacement key for app updates."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate strong JKS and single Base64 JSON bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing-export
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import secrets
          import subprocess

          key_path = Path(os.environ["RUNNER_TEMP"]) / "release.jks"
          password = secrets.token_urlsafe(36)
          alias = "evcockpit"
          env = dict(os.environ, EYA_TEMP_KEYSTORE_PASSWORD=password)
          subprocess.run([
              "keytool", "-genkeypair", "-noprompt",
              "-storetype", "JKS", "-keystore", str(key_path),
              "-storepass:env", "EYA_TEMP_KEYSTORE_PASSWORD",
              "-keypass:env", "EYA_TEMP_KEYSTORE_PASSWORD",
              "-alias", alias, "-keyalg", "RSA", "-keysize", "3072",
              "-validity", "10000",
              "-dname", "CN=EV Cockpit, OU=Android Release, O=Independent, C=TR"
          ], env=env, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          keytool_check = [
              "keytool", "-list", "-keystore", str(key_path),
              "-storepass:env", "EYA_TEMP_KEYSTORE_PASSWORD",
              "-alias", alias
          ]
          subprocess.run(keytool_check, env=env, check=True,
                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          raw = key_path.read_bytes()
          payload = {
              "schema": "eya-signing-v1",
              "keystore_base64": base64.b64encode(raw).decode("ascii"),
              "keystore_sha256": hashlib.sha256(raw).hexdigest(),
              "store_password": password,
              "key_alias": alias,
              "key_password": password
          }
          bundle = base64.b64encode(
              json.dumps(payload, separators=(",", ":")).encode("utf-8")
          ).decode("ascii")

          output = Path("signing-export/EYA_GitHub_TEK_SECRET.txt")
          output.write_text(bundle + "\n", encoding="ascii")
          output.chmod(0o600)
          Path("signing-export/README.txt").write_text(
              "CONFIDENTIAL: The file contains the Android PRIVATE signing key and passwords.\n"
              "Copy its entire one-line content to repository Actions secret "
              "EYA_SIGNING_BUNDLE_BASE64.\n"
              "Save an offline encrypted backup and do not generate another key.\n"
              "Delete the Actions run and artifact before making the repository public again.\n",
              encoding="utf-8"
          )
          key_path.unlink()
          print("The signing bundle is ready in the PRIVATE downloadable artifact.")
          print("No secret or Base64 private key was written to the Actions log.")
          PY

      - name: Download confidential signing bundle
        uses: actions/upload-artifact@v6
        with:
          name: PRIVATE-EYA-GitHub-TEK-SECRET
          path: signing-export/
          if-no-files-found: error
          retention-days: 1

      - name: Erase temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"
