name: EV Cockpit - Generate One Signing Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Protect signing key from public access
        shell: bash
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != 'true' ]; then
            echo '::error::Repository is public. A plaintext signing bundle in an artifact would expose your app signing identity. Generate this bundle only while the repository is private, and delete the workflow run and its artifact before making the repository public again.'
            exit 1
          fi

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and single Base64 signing bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing-export
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, secrets, subprocess

          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'keystore.jks'
          password = secrets.token_urlsafe(36)
          alias = 'evcockpit-production'
          env = dict(os.environ, EYA_GENERATED_STORE_PASSWORD=password)
          subprocess.run([
              'keytool', '-genkeypair', '-noprompt',
              '-keystore', str(target), '-storetype', 'JKS',
              '-storepass:env', 'EYA_GENERATED_STORE_PASSWORD',
              '-keypass:env', 'EYA_GENERATED_STORE_PASSWORD',
              '-alias', alias, '-keyalg', 'RSA', '-keysize', '3072',
              '-validity', '10000',
              '-dname', 'CN=EV Cockpit, OU=Android Release, O=Independent, C=TR',
          ], check=True, env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          raw = target.read_bytes()
          data = {
              'schema': 'eya-signing-v1',
              'keystore_base64': base64.b64encode(raw).decode('ascii'),
              'keystore_sha256': hashlib.sha256(raw).hexdigest(),
              'store_password': password,
              'key_alias': alias,
              'key_password': password,
          }
          bundle = base64.b64encode(json.dumps(data, separators=(',', ':')).encode()).decode('ascii')
          pathlib.Path('signing-export/EYA_SIGNING_BUNDLE_BASE64.txt').write_text(bundle + '\n')
          pathlib.Path('signing-export/README.txt').write_text(
              'CONFIDENTIAL: This single string contains your private Android signing key and passwords.\n'
              'Use it once as GitHub Actions repository secret EYA_SIGNING_BUNDLE_BASE64.\n'
              'Save a secure offline backup. Never regenerate after distributing the first production APK.\n'
              'Delete this private workflow run and its artifact BEFORE changing the repository to public.\n'
          )
          target.unlink()
          print('Signing bundle created without exposing the secret in logs.')
          PY

      - name: Export confidential bundle for one-time setup
        uses: actions/upload-artifact@v6
        with:
          name: PRIVATE-EYA-SIGNING-BUNDLE
          path: signing-export/
          if-no-files-found: error
          retention-days: 1
