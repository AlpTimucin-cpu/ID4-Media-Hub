name: Generate encrypted Android signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Java keytool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_EXPORT_PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          test "${#KEYSTORE_PASSWORD}" -ge 8 || { echo "::error::KEYSTORE_PASSWORD must be at least 8 characters"; exit 1; }
          test "${#KEY_PASSWORD}" -ge 8 || { echo "::error::KEY_PASSWORD must be at least 8 characters"; exit 1; }
          test "${#KEY_ALIAS}" -ge 1 || { echo "::error::KEY_ALIAS is missing"; exit 1; }
          test "${#KEYSTORE_EXPORT_PASSPHRASE}" -ge 20 || { echo "::error::KEYSTORE_EXPORT_PASSPHRASE must be at least 20 characters"; exit 1; }

      - name: Create permanent JKS and encrypted Base64 export
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_EXPORT_PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/eya-production.jks"
          encrypted="$RUNNER_TEMP/eya-production.jks.enc"

          # New identity: run ONCE, back up securely, never replace for upgrades.
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$keystore" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 \
            -validity 10000 -dname "CN=Elektrikli Yol Arkadasim, OU=Android, O=Private, C=TR"

          keytool -list -keystore "$keystore" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null

          # The repository is PUBLIC: never upload a plaintext JKS or its plain Base64.
          # Base64 contains AES-256-CBC ciphertext with PBKDF2/HMAC-SHA256 key derivation.
          openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 300000 \
            -salt -in "$keystore" -out "$encrypted" \
            -pass env:KEYSTORE_EXPORT_PASSPHRASE

          mkdir -p keystore-export
          base64 -w 0 "$encrypted" > keystore-export/KEYSTORE_BASE64.txt
          printf '\n' >> keystore-export/KEYSTORE_BASE64.txt
          printf '%s\n' \
            'ENCRYPTED Base64 keystore backup. NOT a plaintext JKS.' \
            'Copy the contents of KEYSTORE_BASE64.txt into GitHub Actions secret KEYSTORE_BASE64.' \
            'Keep KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD and KEYSTORE_EXPORT_PASSPHRASE secrets unchanged.' \
            'Never regenerate after your first app release: Android updates need the same signing key.' \
            'Store a second offline backup of the encrypted file and passwords.' \
            > keystore-export/README.txt
          rm -f "$keystore" "$encrypted"

      - name: Download encrypted signing-key backup
        uses: actions/upload-artifact@v4
        with:
          name: EYA-ENCRYPTED-KEYSTORE-BASE64
          path: keystore-export/
          if-no-files-found: error
          retention-days: 1
