name: Elektrikli Yol Arkadaşım APK (TV ve rota koruma)
on:
  workflow_dispatch:
  pull_request:
    branches: [feature/mola-32-migration]
  push:
    branches: [feature/mola-native-id4]
    paths:
      - 'mola-native/**'
      - '.github/workflows/build-mola-native-id4.yml'
permissions:
  contents: read
concurrency:
  group: elektrikli-yol-arkadasim-build
  cancel-in-progress: true
jobs:
  elektrikli-yol-arkadasim-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Uygulama entegrasyon dosyalarını al
        uses: actions/checkout@v4
        with:
          path: integration
      - name: GPL lisanslı medya tabanını al
        # The pinned source tree includes a large historical APK on Git LFS.
        # Compiling needs the GPL sources only, not a 160 MB LFS binary.
        # Downloading that unrelated binary sometimes returns GitHub LFS 502.
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/moris545454/araba-.git mola
          cd mola
          git checkout --detach 3f45ad3557a25822c2a3a9f152f32ef82f57e005
          test "$(git rev-parse HEAD)" = "3f45ad3557a25822c2a3a9f152f32ef82f57e005"
          test -f LICENSE
      - name: Elektrikli Yol Arkadaşım entegrasyonunu uygula
        # Never inject account API secrets into publicly downloadable APKs.
        # Each user supplies their own TomTom key in the native settings.
        run: python3 integration/mola-native/patch_mola.py mola integration/mola-native/overlay
      - name: Android araç entegrasyonu ve medya uyumluluğunu doğrula
        run: python3 integration/mola-native/tests/test_android_auto_manifest.py mola
      - name: Korunan medya oynatıcı kaynaklarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          cd mola
          git diff --name-only | tee /tmp/mola-modified.txt
          cat >/tmp/expected.txt <<'EOF'
          fermata/src/auto/AndroidManifest.xml
          fermata/src/auto/res/xml/automotive_app_desc.xml
          fermata/src/main/AndroidManifest.xml
          fermata/src/main/java/me/aap/fermata/ui/activity/MainActivity.java
          fermata/src/main/java/me/aap/fermata/ui/fragment/AudioEffectsPrefsBuilder.java
          fermata/src/main/java/me/aap/fermata/ui/fragment/DashboardCard.java
          fermata/src/main/java/me/aap/fermata/ui/fragment/DashboardFragment.java
          fermata/src/main/java/me/aap/fermata/ui/fragment/PlaybackPrefsBuilder.java
          fermata/src/main/java/me/aap/fermata/ui/fragment/SettingsFragment.java
          fermata/src/main/res/layout/dashboard_fragment.xml
          fermata/src/main/res/values-tr/strings.xml
          fermata/src/main/res/values/strings.xml
          EOF
          diff -u /tmp/expected.txt /tmp/mola-modified.txt
          test -s fermata/src/main/java/me/aap/fermata/ev/Id4EvActivity.java
          test -s fermata/src/main/assets/id4/index.html
          # Compare code for TV, VLC, YouTube, MediaProjection etc with base.
          git diff --exit-code -- modules/tv modules/web modules/vlc modules/exoplayer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify journey card survives media refresh
        run: python3 integration/mola-native/tests/test_dashboard_identity.py mola
      - name: Araç görünümünde manuel enerji girişi olmadığını doğrula
        shell: bash
        run: |
          set -euo pipefail
          python3 integration/mola-native/tests/test_vehicle_dashboard.py \
            integration/mola-native/overlay \
            integration/mola-native/patch_mola.py
      - name: Validate embedded navigation, dual search and no-GPS route
        shell: bash
        run: |
          set -euo pipefail
          node --check integration/mola-native/tests/test_basemap.js
          node integration/mola-native/tests/test_basemap.js
          node --check integration/mola-native/tests/test_navigator.js
          # Word delivery: parse-check both attached scripts before packaging.
          node --check integration/mola-native/overlay/fermata/src/main/assets/id4/id4-live-map.js
          node --check integration/mola-native/overlay/fermata/src/main/assets/id4/id4-navigator-adapter.js
          node --check integration/mola-native/tests/test_live_map.js
          node integration/mola-native/tests/test_live_map.js
          node integration/mola-native/tests/test_journey_guide_integration.js
          node integration/mola-native/tests/test_visible_brand.js
          # Premium cockpit skin is separate from the tested route/OBD bridge.
          node --check integration/mola-native/overlay/fermata/src/main/assets/id4/id4-tesla-cockpit.js
          node integration/mola-native/tests/test_tesla_cockpit.js
          node integration/mola-native/tests/test_eya_cockpit.cjs
          node --check integration/mola-native/overlay/fermata/src/main/assets/id4/eya-trip-planner.js
          node integration/mola-native/tests/test_eya_trip_planner.cjs
          node --check integration/mola-native/overlay/fermata/src/main/assets/id4/eya-charging-model.js
          node --check integration/mola-native/overlay/fermata/src/main/assets/id4/eya-corridor-stations.js
          node --check integration/mola-native/overlay/fermata/src/main/assets/id4/eya-energy-route.js
          node integration/mola-native/tests/test_eya_charging_model.cjs
          node integration/mola-native/tests/test_eya_corridor_stations.cjs
          node --check integration/mola-native/overlay/fermata/src/main/assets/id4/id4-mola-media.js
          node integration/mola-native/tests/test_mola_media.js
          node --check integration/mola-native/tests/test_id4_native_bridge.js
          node integration/mola-native/tests/test_id4_native_bridge.js
          python3 - <<'PY'
          from pathlib import Path
          root=Path('integration/mola-native/overlay/fermata/src/main/assets/id4')
          html=(root/'navigator.html').read_text()
          core=(root/'id4-live-map.js').read_text()
          adapter=(root/'id4-navigator-adapter.js').read_text()
          assert html.count('window.id4LiveLeafletMap=map')==1
          assert html.count('window.ID4_LIVE_ATTACH_ONLY=true')==1
          assert html.count('src="id4-live-map.js"')==1
          assert html.count('src="id4-navigator-adapter.js"')==1
          assert 'ingestNativeRoute' in core and 'attachExistingMap' in core
          assert 'window.id4LiveLeafletMap' in adapter or 'id4LiveLeafletMap' in adapter
          assert 'localIncidentKey' in core and 'corridorKm: 5' in core
          print('PASS: Word addon attaches to existing navigator, no duplicate map')
          PY
          node integration/mola-native/tests/test_navigator.js \
            integration/mola-native/overlay/fermata/src/main/assets/id4/navigator.html
          node --check integration/mola-native/overlay/fermata/src/main/assets/id4/traffic-provider.js
          node integration/mola-native/tests/test_traffic_provider.js
          # A missing/uncertain GPS fix must never grant video permission.
          python3 - <<'PY'
          from pathlib import Path
          src=Path('integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4NavigatorActivity.java').read_text()
          start=src.index('private boolean videoLaunchBlockedByMotion()')
          end=src.index('private void openOfficialVideo(',start)
          gate=src[start:end]
          assert 'p==null' in gate and 'p.getAccuracy()>35' in gate
          assert '!p.hasSpeed()' in gate and 'return true;' in gate
          assert 'elapsed>15000' in gate and 'p.getSpeed()>0.4f' in gate
          assert 'if(videoLaunchBlockedByMotion())' in src
          assert 'if(movingWithRecentGps())' not in src
          print('PASS: video launch fails closed on missing, stale and moving GPS')
          PY
          # One native owner of the API key. Uploaded JS getter bridge was
          # intentionally not shipped: WebView JavaScript can be reached from
          # subframes, so it must not expose unrestricted credential reads.
          python3 - <<'PY'
          from pathlib import Path
          java=Path('integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev')
          store=(java/'Id4ApiKeyStore.java').read_text()
          nav=(java/'Id4NavigatorActivity.java').read_text()
          build=Path('integration/mola-native/patch_mola.py').read_text()
          assert 'AndroidKeyStore' in store and 'AES/GCM/NoPadding' in store
          assert 'setKeySize(256)' in store
          assert 'PREFIX_PLAIN' not in store
          assert 'Base64.encodeToString(cipher.getIV()' in store
          assert 'Id4ApiKeyStore.set(this,key)' in nav
          assert 'Id4ApiKeyStore.clear(this)' in nav
          assert 'Id4ApiKeyStore.get(this)' in nav
          assert 'legacy.edit().remove("tomtom").commit()' in nav
          assert 'addJavascriptInterface(new Id4KeyBridge' not in nav
          assert not (java/'Id4KeyBridge.java').exists()
          assert 'api_key_store' in build
          print('PASS: Keystore encryption, legacy migration, no plaintext or extra JS secret bridge')
          PY
      - name: Render and validate cockpit at phone and reference sizes
        run: |
          npm install --prefix "$RUNNER_TEMP/id4-browser" playwright
          NODE_PATH="$RUNNER_TEMP/id4-browser/node_modules" \
          CHROME_BIN="$(command -v google-chrome)" \
          ID4_SCREENSHOTS="$RUNNER_TEMP/id4-layout" \
          node integration/mola-native/tests/test_cockpit_layout.cjs
      - name: Verify live OpenFreeMap vector map in Turkey
        run: |
          NODE_PATH="$RUNNER_TEMP/id4-browser/node_modules" \
          CHROME_BIN="$(command -v google-chrome)" \
          ID4_SCREENSHOTS="$RUNNER_TEMP/id4-layout" \
          node integration/mola-native/tests/test_vector_map.cjs
      - name: Kokpit görünüm testlerini yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elektrikli-Yol-Arkadasim-Gorsel-Testleri
          path: ${{ runner.temp }}/id4-layout
          retention-days: 7
      - name: Şarj geçmişi ve veri tazeliğini test et
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charge-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/charge-tests" \
            integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4ChargeHistory.java \
            integration/mola-native/tests/Id4ChargeHistoryTest.java
          java -ea -cp "$RUNNER_TEMP/charge-tests" Id4ChargeHistoryTest
      - name: Validate automatic energy has no manual-entry controls
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -d "$RUNNER_TEMP/charge-tests" \
            integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4EnergyModel.java \
            integration/mola-native/tests/Id4EnergyModelTest.java
          java -ea -cp "$RUNNER_TEMP/charge-tests" Id4EnergyModelTest
          javac -encoding UTF-8 -d "$RUNNER_TEMP/charge-tests" \
            integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4EnergyModel.java \
            integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4ChargeAdvisor.java \
            integration/mola-native/tests/Id4ChargeAdvisorTest.java
          java -ea -cp "$RUNNER_TEMP/charge-tests" Id4ChargeAdvisorTest
          javac -encoding UTF-8 -d "$RUNNER_TEMP/charge-tests" \
            integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4ChargeCost.java \
            integration/mola-native/tests/Id4ChargeCostTest.java
          java -ea -cp "$RUNNER_TEMP/charge-tests" me.aap.fermata.ev.Id4ChargeCostTest
          javac -encoding UTF-8 -d "$RUNNER_TEMP/charge-tests" \
            integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4EnergyModel.java \
            integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4ChargeCost.java \
            integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4TripChargePlan.java \
            integration/mola-native/tests/Id4TripChargePlanTest.java
          java -ea -cp "$RUNNER_TEMP/charge-tests" me.aap.fermata.ev.Id4TripChargePlanTest
          python3 - <<'PY'
          from pathlib import Path
          s=Path("integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4EvActivity.java").read_text()
          a=s[s.index('private void energyScreen()'):s.index('private void showPrices()')]
          assert 'field(' not in a
          assert 'EditText' not in a
          assert 'renderAutoEnergy' in a and 'fetchAutomaticPrice' in a
          assert 'Id4EnergyData.load' in a
          print('PASS: no manual energy form; route/OBD/price bound to sources')
          PY
      - name: Reject uncalibrated ELM327 readings as live vehicle measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/obd-safety"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/obd-safety" \
            integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4MebDecoder.java \
            integration/mola-native/tests/Id4MebDecoderSafetyTest.java
          java -ea -cp "$RUNNER_TEMP/obd-safety" Id4MebDecoderSafetyTest
      - name: Check EPDK AC/DC socket classification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/station-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/station-tests" \
            integration/mola-native/overlay/fermata/src/main/java/me/aap/fermata/ev/Id4StationTypes.java \
            integration/mola-native/tests/Id4StationTypesTest.java
          java -ea -cp "$RUNNER_TEMP/station-tests" me.aap.fermata.ev.Id4StationTypesTest
      - name: Install matching Android toolchain
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
      - name: Elektrikli Yol Arkadaşım APK oluştur
        shell: bash
        working-directory: mola
        env:
          NO_GS: 'true'
          APP_ID_SFX: '.id4preview'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-parallel verifyWebOnlyProductionGraph
          # The public Mola build.sh conflates APP_ID_SFX env with flavor.
          # Pass the suffix as an explicit Gradle *property* instead.
          ./gradlew --no-daemon --no-parallel :fermata:packageAutoDebugUniversalApk -PAPP_ID_SFX=.id4preview -PAPP_NAME="Elektrikli Yol Arkadaşım"
          mkdir -p dist
          mapfile -t built < <(find fermata/build/outputs/apk_from_bundle -type f -name 'fermata*.apk' -print)
          test "${#built[@]}" -eq 1
          cp "${built[0]}" dist/FermataX-id4preview.apk
      - name: Gerçek harita kodlarını ve paket izinlerini doğrula
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          packages=list(Path("mola/dist").glob("*.apk"))
          assert len(packages)==1,"Exactly one APK must be present"
          with ZipFile(packages[0]) as apk:
              entries=set(apk.namelist())
              html=apk.read("assets/id4/navigator.html").decode("utf-8")
              scripts=[
                  "id4-offline-geography.js","id4-basemap.js",
                  "traffic-provider.js","traffic-config.js",
                  "leaflet.js","leaflet.css","maplibre-gl.js","maplibre-gl.css",
                  "id4-tesla-cockpit.css","id4-tesla-cockpit.js",
                  "eya-cockpit-3070.css","eya-trip-planner.js","eya-trip-planner.css",
                  "eya-charging-model.js","eya-corridor-stations.js",
                  "eya-energy-route.js","eya-tesla-abrp.css",
                  "maplibre-gl-leaflet.js","MAPLIBRE_LICENSE.txt","MAPLIBRE_LEAFLET_LICENSE.txt",
              ]
              missing=["assets/id4/"+name for name in scripts
                       if "assets/id4/"+name not in entries]
              assert not missing,"APK missing map scripts: "+", ".join(missing)
              for name in ["id4-offline-geography.js","id4-basemap.js"]:
                  assert 'src="'+name+'"' in html
                  assert len(apk.read("assets/id4/"+name))>1000
              assert 'id="id4-tesla-side"' in html
              assert 'src="id4-tesla-cockpit.js"' in html
              assert 'href="id4-tesla-cockpit.css"' in html
              assert 'href="eya-cockpit-3070.css"' in html
              assert 'href="eya-trip-planner.css"' in html
              assert 'src="eya-trip-planner.js"' in html
              for js in ("eya-charging-model.js","eya-corridor-stations.js",
                         "eya-energy-route.js"):
                  assert 'src="'+js+'"' in html
              assert 'href="eya-tesla-abrp.css"' in html
              # Browser model scripts MUST load before the trip-planner observer.
              assert html.index('src="eya-charging-model.js"') < html.index('src="eya-trip-planner.js"')
              assert html.index('src="eya-corridor-stations.js"') < html.index('src="eya-trip-planner.js"')
              assert "Id4BaseMap.init(map" in html
              assert 'class="dock-climate"' not in html
              assert 'KLİMA</' not in html
              assert "body.provider-active #map{visibility:hidden}" not in html
              # Never distribute shared API credentials in public artifacts.
              # Actual values live in app-private settings and are injected
              # into WebView only when the user explicitly configures them.
              cfg=apk.read("assets/id4/traffic-config.js").decode("utf-8")
              assert cfg.strip()=='window.ID4_TRAFFIC_CONFIG={tomtomKey:""};', (
                  "Refusing public APK containing build-time traffic credentials")
              print("PASS: installed APK contains real map scripts, no climate widgets and no TomTom build key")
          PY
      - name: Önizleme uygulamasının mevcut kullanıcı verilerini koruduğunu doğrula
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find mola/dist -maxdepth 1 -name 'FermataX-*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" > /tmp/mola-preview-package.txt
          # Final binary gate: an external proprietary APK is NOT the build input.
          # Do not accidentally inherit its mic/file/video permissions.
          "$AAPT" dump permissions "$APK" > /tmp/id4-preview-permissions.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          manifest=Path('/tmp/id4-preview-permissions.txt').read_text()
          rejected={
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.MANAGE_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE'
          }
          requested=set(re.findall(r"uses-permission(?:-sdk-\d+)?: name='([^']+)'",manifest))
          found=sorted(requested.intersection(rejected))
          assert not found, 'Unexpected microphone/camera/filesystem permissions: '+str(found)
          print('PASS: final merged ID4 preview requests no microphone/camera/general media read permissions')
          PY
          head -3 /tmp/mola-preview-package.txt
          grep -q 'id4preview' /tmp/mola-preview-package.txt
          # aapt badging omits some activity-alias labels on newer SDK tools:
          # inspect the compiled manifest directly instead of grepping badging.
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/id4-compiled-manifest.txt
          grep -q 'Id4Launcher' /tmp/id4-compiled-manifest.txt
          # Verify the COMPILED manifest, not only the pre-merge XML.
          # Android Auto template apps are exposed through a real CarAppService;
          # a phone LAUNCHER alias alone does not make them host discoverable.
          grep -Fq 'com.google.android.gms.car.application' /tmp/id4-compiled-manifest.txt
          grep -Fq 'me.aap.fermata.ev.Id4CarPoiService' /tmp/id4-compiled-manifest.txt
          grep -Fq 'androidx.car.app.CarAppService' /tmp/id4-compiled-manifest.txt
          grep -Fq 'androidx.car.app.category.POI' /tmp/id4-compiled-manifest.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/id4-compiled-manifest.txt').read_text()
          assert 'Id4Launcher' in s
          assert 'Elektrikli Yol Arkadaşım' in s
          print('PASS: Elektrikli Yol Arkadaşım label and launcher alias in binary manifest')
          PY
          if grep -q "package: name='me.app.fermataX.auto.mola32.debug'" /tmp/mola-preview-package.txt; then
            echo "::error::Refusing APK that could overwrite the original media player"
            exit 1
          fi
          test "$(stat -c %s "$APK")" -gt 10000000
          mkdir -p output
          cp "$APK" output/Elektrikli-Yol-Arkadasim.apk
          sha256sum output/Elektrikli-Yol-Arkadasim.apk | tee output/SHA256.txt
      - name: Elektrikli Yol Arkadaşım APK paketini yükle
        uses: actions/upload-artifact@v4
        with:
          name: Elektrikli-Yol-Arkadasim-APK
          path: |
            output/Elektrikli-Yol-Arkadasim.apk
            output/SHA256.txt
          retention-days: 7
          if-no-files-found: error
